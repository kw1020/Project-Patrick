# One command: docker compose up --build   →  dashboard at http://localhost:3000
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: file:/data/clip-factory.db
    REDIS_URL: redis://redis:6379
    STORAGE_DIR: /storage
    HF_HOME: /models   # Whisper model cache (downloaded once)
  volumes:
    - data:/data
    - ./storage:/storage   # clips land in ./storage/final on your computer too
    - models:/models
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    restart: unless-stopped

  web:
    <<: *app
    command: sh -c "npx prisma db push --skip-generate && npm start"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: npm run worker
    depends_on:
      web:
        condition: service_healthy   # web creates the database first

volumes:
  data:
  redis:
  models:
