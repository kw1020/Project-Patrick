# One command: docker compose up --build   →  dashboard at http://localhost:3000
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: file:/data/clip-factory.db
    REDIS_URL: redis://redis:6379
    STORAGE_DIR: /storage
    HF_HOME: /models   # Whisper model cache (downloaded once)
    # v1.9.4: the folder on your PC the clips live in (shown on Settings -> Storage). Empty = ./storage.
    CLIP_STORAGE_HOST_DIR: ${CLIP_STORAGE_DIR:-}
    MUSIC_DIR: /music  # songs for edit timing (never put into a video)
  volumes:
    - data:/data
    # Clips land in this folder on your computer too. CLIP_STORAGE_DIR in .env moves them to another drive
    # (e.g. D:/ClipFactory/storage); empty or missing = ./storage next to this file (v1.9.4).
    - ${CLIP_STORAGE_DIR:-./storage}:/storage
    - models:/models
    - ./music:/music:ro    # drop the song you'll use in TikTok here to cut edits to its beat
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    restart: unless-stopped

  web:
    <<: *app
    command: sh -c "npx prisma db push --skip-generate && npm start"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: npm run worker
    depends_on:
      web:
        condition: service_healthy   # web creates the database first

volumes:
  data:
  redis:
  models:
