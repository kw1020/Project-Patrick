# Runs GameSwap's tests on real Windows and builds GameSwap.exe and its installer.
# A push publishes the installer as a GitHub Release (tag gameswap-vX.Y.Z);
# the installed GameSwap finds it there and updates itself.
name: GameSwap (Windows)

on:
  push:
    paths:
      - "gameswap/**"
      - ".github/workflows/gameswap-windows.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write  # to publish the GitHub Release that GameSwap updates itself from
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gameswap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt "pyinstaller>=6.6"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the Schedule I helper mod
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip" -OutFile ml.zip
          Expand-Archive ml.zip -DestinationPath build\melonloader -Force
          dotnet build helper_mod\GameSwapHelper.csproj -c Release -nologo
          if ($LASTEXITCODE -ne 0) { throw "the helper mod didn't build" }
          Copy-Item helper_mod\bin\Release\net6.0\GameSwapHelper.dll gameswap\assets\

      - name: Build GameSwap.exe
        run: python -m PyInstaller --noconfirm --clean GameSwap.spec

      - name: Self-test GameSwap.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\GameSwap\GameSwap.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist\GameSwap\selftest-result.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup's ISCC.exe wasn't found" }
          $version = python -c "import gameswap; print(gameswap.__version__)"
          & $iscc.FullName "/DAppVersion=$version" installer\GameSwap.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\installer

      - name: Test the installer (install, self-test, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\GameSwap-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\GameSwap"
          if (-not (Test-Path "$app\GameSwap.exe")) { throw "GameSwap.exe wasn't installed" }
          if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\GameSwap.lnk"))) { throw "no Start menu shortcut" }
          $t = Start-Process "$app\GameSwap.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$app\selftest-result.txt"
          if ($t.ExitCode -ne 0) { throw "installed self-test failed" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\GameSwap.exe") { throw "uninstall left GameSwap.exe behind" }
          Write-Host "Installer OK: installs, runs, uninstalls."

      - uses: actions/upload-artifact@v4
        with:
          name: GameSwap-windows
          path: gameswap/dist/GameSwap
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: GameSwap-Setup
          path: gameswap/dist/installer/*.exe
          retention-days: 30

      - name: Publish the update (GitHub Release)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import gameswap; print(gameswap.__version__)"
          $tag = "gameswap-v$version"
          $setup = Get-ChildItem dist\installer\GameSwap-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $sha = "$($setup.FullName).sha256"
          "$hash  $($setup.Name)" | Out-File -Encoding ascii -NoNewline $sha
          $tags = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq ".[].tagName"
          if ($tags -contains $tag) {
            gh release upload $tag $setup.FullName $sha --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $setup.FullName $sha --repo "${{ github.repository }}" --target "${{ github.sha }}" `
              --title "GameSwap $version" --latest=false `
              --notes "GameSwap $version. Installed GameSwap updates itself to this version (Update button). First install: download GameSwap-Setup-$version.exe below."
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
          Write-Host "Published $tag"
