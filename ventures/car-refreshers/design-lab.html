<title>Sutherland Design Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Layout: a lit stage on the left (3D object, or the mixing beaker in the lab), the workshop on the right, saved designs below. Dark-only on purpose: the brand lives at night. */
  :root {
    color-scheme: dark;
    --bg: #0e0d0b;
    --panel: #161411;
    --panel-2: #1d1a16;
    --line: #2d2923;
    --text: #ede7db;
    --muted: #9b9383;
    --brass: #c9a961;
    --brass-soft: #e6d3a3;
    --warn: #e0a458;
    --ok: #8fb59a;
    --top: #eadcae;
    --heart: #c9a961;
    --base: #7d5a33;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    margin: 0; font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 56px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .shell { max-width: 1240px; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--brass); }

  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px 16px; }
  .brand h1 { margin: 2px 0 0; font: 500 34px/1.05 var(--display); }
  .seg { display: inline-flex; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 7px 16px; cursor: pointer; border-radius: 999px;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: baseline;
  }
  .seg button small { font: 11px var(--mono); letter-spacing: 0; text-transform: none; opacity: .8; }
  .seg button[aria-pressed="true"] { background: linear-gradient(180deg, #dcc07a, #b8964c); color: #15120c; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 4px 14px rgba(201,169,97,.25); }

  nav.modes { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
  nav.modes button {
    background: transparent; border: 0; padding: 12px 16px; cursor: pointer; color: var(--muted);
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.modes button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--brass); }

  .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 18px; }
  .tiercard {
    text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: linear-gradient(180deg, #1c1915, #141210); color: var(--text); min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .tiercard:hover { border-color: #5a4b2c; }
  .tiercard[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset, 0 14px 30px -18px rgba(201,169,97,.6); }
  .tiercard .th { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tiercard .th b { font: 500 24px/1 var(--display); }
  .tiercard .th span { font: 13px var(--mono); color: var(--brass-soft); }
  .tiercard .tg { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
  .tiercard dl { margin: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; font-size: 12.5px; }
  .tiercard dt { color: var(--muted); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; padding-top: 2px; }
  .tiercard dd { margin: 0; color: #d8d1c3; }
  .gems { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
  .gems i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--line); }
  .gems i.on { background: var(--brass); }
  .gradeline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .gradeline b { color: var(--brass-soft); font-weight: 500; }
  @media (max-width: 760px) {
    .tiers { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(250px, 82%); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .tiercard { scroll-snap-align: start; }
  }
  main.lab { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 28px; padding-top: 24px; align-items: start; }
  .bench { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .right { display: grid; gap: 18px; min-width: 0; align-content: start; }

  .stage {
    position: relative; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; border-radius: 18px;
    background: radial-gradient(ellipse 70% 55% at 50% 40%, #2c251b 0%, #17140f 55%, #0b0a08 100%);
    box-shadow: 0 0 0 1px var(--line), 0 30px 60px -30px rgba(0,0,0,.8);
  }
  .stage canvas, .stage .svgfb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas#gl { cursor: grab; touch-action: pan-y; }
  .stage canvas#gl:active { cursor: grabbing; }
  .stage .svgfb svg { width: 100%; height: 100%; }
  .stage .readout {
    position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    font: 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .readout b { color: var(--brass-soft); font-weight: 500; }
  .stage .hint { position: absolute; top: 14px; left: 16px; font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; pointer-events: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
  .card h2 { margin: 0; font: 500 30px/1.05 var(--display); text-wrap: balance; }
  .story { color: var(--muted); margin: -6px 0 0; font: italic 500 18px var(--display); }
  .notesline { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px; font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
  .flags { display: grid; gap: 6px; }
  .flag { font-size: 13px; padding: 8px 10px; border-left: 2px solid var(--warn); background: #211b12; color: #ead7b5; border-radius: 0 8px 8px 0; }
  .flag.ok { border-left-color: var(--ok); background: #141b16; color: #cfe0d3; }

  /* Workshop */
  .workshop { display: grid; gap: 18px; min-width: 0; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
  .group > .lbl, .group > label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
  .hint2 { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile {
    display: grid; justify-items: center; gap: 7px; padding: 12px 10px 10px; min-width: 82px; cursor: pointer;
    border: 1px solid var(--line); background: linear-gradient(180deg, #211e19, #191713); border-radius: 12px; font-size: 12.5px; color: var(--text);
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .tile:hover { border-color: #5a4b2c; transform: translateY(-1px); }
  .tile[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset, 0 8px 22px -10px rgba(201,169,97,.55); }
  .ball { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, var(--l) 0%, var(--m) 42%, var(--d) 88%); box-shadow: 0 6px 12px -4px rgba(0,0,0,.7), inset 0 -2px 4px rgba(0,0,0,.35); }
  .shapeicon { width: 38px; height: 38px; }
  .patt { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 12px -4px rgba(0,0,0,.7); background-color: #8a7444; }
  .patt.plain { background: radial-gradient(circle at 35% 30%, #e9d29a, #a88a48 60%, #6b5428); }
  .patt.guilloche { background: repeating-radial-gradient(circle at 50% 50%, #c9ad6a 0 2px, #9c8040 2px 4px); }
  .patt.knurl { background: repeating-conic-gradient(#b59650 0 4deg, #6e5527 4deg 8deg); }
  .patt.carbon { background: repeating-linear-gradient(45deg, #2b2b2b 0 4px, #161616 4px 8px); }
  .patt.perforated { background: radial-gradient(circle, #15120d 0 2.2px, transparent 2.6px) 0 0 / 8px 8px, radial-gradient(circle at 35% 30%, #e9d29a, #a88a48 60%, #6b5428); }
  .patt.sunburst { background: repeating-conic-gradient(#e9d29a 0 3deg, #9c8040 3deg 6deg); }
  .bz { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, #15130f 0 50%, transparent 51%), var(--ring); box-shadow: 0 6px 12px -4px rgba(0,0,0,.7); }
  .bz.polished { --ring: radial-gradient(circle at 35% 30%, #fff2c8, #d9b863 50%, #7e6024); }
  .bz.fluted { --ring: repeating-conic-gradient(#f3dda6 0 6deg, #7e6024 6deg 12deg); }
  .bz.knurled { --ring: repeating-conic-gradient(#d9b863 0 2deg, #5e4720 2deg 4deg); }
  .dl { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 2px #b8964c, 0 6px 12px -4px rgba(0,0,0,.7); }
  .dl.sunburst { background: repeating-conic-gradient(color-mix(in srgb, var(--c) 75%, white) 0 3deg, var(--c) 3deg 6deg); }
  .dl.clous { background: repeating-linear-gradient(45deg, rgba(255,255,255,.2) 0 3px, transparent 3px 6px), repeating-linear-gradient(-45deg, rgba(0,0,0,.28) 0 3px, transparent 3px 6px), var(--c); }
  .dl.walnut { background: radial-gradient(ellipse at 30% 40%, #8a5a30 0 12%, #4a2a16 30%, #7a4c26 45%, #3a2212 70%); }
  .dl.carbon { background: conic-gradient(from 20deg, #1a1a1a, #3c3c3c, #121212, #2e2e2e, #1a1a1a); }
  .dl.enamel { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, white), var(--c) 55%, color-mix(in srgb, var(--c) 70%, black)); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pillbtn { border: 1px solid var(--line); background: var(--panel-2); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
  .pillbtn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-soft); background: #2a2419; }
  .pillbtn .sw { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
  input[type="text"] { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
  input[type="text"]:focus { border-color: var(--brass); outline: none; }
  input[type="range"] { width: 100%; accent-color: var(--brass); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row2 > div { display: grid; gap: 8px; min-width: 0; }
  .row2 label, .rangehead label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
  .rangehead { display: flex; justify-content: space-between; align-items: baseline; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .rangehead b { color: var(--text); font-weight: 500; }

  .btn { border: 1px solid var(--brass); background: linear-gradient(180deg, #dcc07a, #b8964c); color: #15120c; padding: 10px 16px; cursor: pointer; border-radius: 999px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--brass); }
  .btn.small { padding: 6px 12px; font-size: 11px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .status { font-size: 13px; color: var(--muted); }

  /* Scent lab */
  .formula { display: grid; gap: 4px; }
  .ftier { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding-top: 8px; display: flex; justify-content: space-between; }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .frow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
  .frow .nm i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.18); }
  .frow .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
  .stepper button { width: 28px; height: 26px; border: 0; background: transparent; cursor: pointer; color: var(--brass-soft); font-size: 16px; line-height: 1; }
  .stepper button:disabled { opacity: .3; cursor: not-allowed; }
  .stepper b { min-width: 22px; text-align: center; font: 500 13px var(--mono); }
  .frow .pct { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .balance { display: grid; gap: 8px; }
  .bal { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
  .bal span { height: 100%; transition: width .4s ease; }
  .bal .t { background: var(--top); } .bal .h { background: var(--heart); } .bal .b { background: var(--base); }
  .balkey { display: flex; gap: 14px; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .balkey i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  .balmsg { font-size: 14px; }
  .balmsg.good { color: var(--ok); } .balmsg.meh { color: var(--warn); }
  .emptynote { color: var(--muted); font-size: 14px; margin: 0; }

  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
  .recipe { border: 1px solid var(--line); background: linear-gradient(180deg, #201d18, #181611); border-radius: 12px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
  .recipe.on { border-color: var(--brass); }
  .recipe .rh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .recipe b { font: 500 21px/1.1 var(--display); }
  .recipe small { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
  .recipe .rbar { display: flex; height: 7px; border-radius: 999px; overflow: hidden; }
  .recipe .rbar span { background: var(--c); }
  .recipe .rnotes { font-size: 12.5px; color: var(--muted); }

  .shelf { display: grid; gap: 14px; }
  .shelfrow { display: grid; gap: 4px; }
  .shelfrow > span { font-size: 12px; color: var(--muted); }
  .vials { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 0 6px 10px; position: relative; }
  .vials::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; border-radius: 3px;
    background: linear-gradient(180deg, #5a4628 0%, #3a2c17 60%, #1c150b 100%); box-shadow: 0 8px 14px -6px rgba(0,0,0,.8);
  }
  .vial { position: relative; z-index: 1; display: grid; justify-items: center; align-content: start; gap: 4px; width: 66px; padding: 4px 2px 6px; background: transparent; border: 0; cursor: pointer; border-radius: 10px; }
  .vial:hover .bottle { transform: translateY(-4px) rotate(-3deg); }
  .bottle { position: relative; display: block; width: 30px; transition: transform .18s ease; filter: drop-shadow(0 6px 6px rgba(0,0,0,.55)); }
  .bottle .cap { display: block; width: 18px; height: 11px; margin: 0 auto; border-radius: 3px 3px 1px 1px; background: linear-gradient(90deg, #121110, #3d3934 45%, #141311); box-shadow: inset 0 -2px 0 #b8964c; }
  .bottle .neck { display: block; width: 12px; height: 6px; margin: 0 auto; background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.05) 50%, rgba(255,255,255,.18)); }
  .bottle .glass {
    display: block; position: relative; height: 46px; border-radius: 7px 7px 11px 11px; overflow: hidden;
    background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.03) 32%, rgba(255,255,255,.02) 70%, rgba(255,255,255,.14));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
  }
  .bottle .liq { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 68%; border-radius: 2px 2px 9px 9px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, black), var(--c) 40%, color-mix(in srgb, var(--c) 70%, white) 85%, color-mix(in srgb, var(--c) 75%, black)); }
  .bottle .liq::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: color-mix(in srgb, var(--c) 55%, white); opacity: .7; }
  .bottle .shine { position: absolute; left: 5px; top: 5px; width: 4px; height: 30px; border-radius: 4px; background: rgba(255,255,255,.35); }
  .vial .vn { font-size: 11.5px; line-height: 1.2; text-align: center; color: var(--text); }
  .vial .vt { font: 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .vial .count { position: absolute; top: 0; right: 6px; z-index: 2; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--brass); color: #15120c; font: 600 11px/18px var(--mono); text-align: center; }
  .vial.rec .bottle::after { content: ""; position: absolute; inset: -6px -8px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(201,169,97,.55), 0 0 18px rgba(201,169,97,.35); }
  .vial:disabled { opacity: .4; cursor: not-allowed; }
  .pairs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 2px 4px; }
  .pairs .vial { width: 96px; flex-shrink: 0; }
  .pairs .why { font-size: 10.5px; color: var(--brass-soft); text-align: center; line-height: 1.25; }

  .economics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .economics div { background: var(--panel-2); padding: 12px; display: grid; gap: 2px; min-width: 0; }
  .economics span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .economics b { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; }
  .economics small { font-size: 12px; color: var(--muted); }
  pre.spec { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; font: 12.5px/1.6 var(--mono); color: #d9d2c4; white-space: pre-wrap; word-break: break-word; }

  section.saved { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 22px; display: grid; gap: 16px; }
  section.saved header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  section.saved h2 { margin: 2px 0 0; font: 500 28px var(--display); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .gcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  .gcard.current { border-color: var(--brass); }
  .gcard .thumb { aspect-ratio: 1/1; background: radial-gradient(ellipse at 50% 38%, #2a241b 0%, #12100d 70%); max-width: 100%; }
  .gcard .thumb svg { width: 100%; height: 100%; display: block; }
  .gcard .meta { padding: 10px 12px 4px; display: grid; gap: 2px; min-width: 0; }
  .gcard .meta b { font: 500 20px/1.1 var(--display); overflow-wrap: anywhere; }
  .gcard .meta span { font-size: 12px; color: var(--muted); }
  .gcard .acts { display: flex; gap: 6px; padding: 8px 12px 12px; }
  .gcard .acts button { flex: 1; }
  .gallery > .emptystate { grid-column: 1 / -1; }
  .emptystate { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); font-size: 14px; }

  @media (max-width: 900px) {
    main.lab { display: block; }
    .right { margin-top: 18px; }
    .bench { position: static; }
    body.mode-scent .bench { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
    body.mode-scent .stage { aspect-ratio: auto; height: 40vh; max-height: 340px; min-height: 230px; }
  }
  @media (max-width: 480px) {

          g.fillStyle = cg; g.beginPath(); g.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2); g.fill();
        }
        g.restore();
        g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(G.x0, yL - 1, G.bw, 3);
        if (!REDUCED && Math.random() < 0.06 + level * 0.06) bubbles.push({ x: G.x0 + 10 + Math.random() * (G.bw - 20), y: G.yB - 6, r: 1 + Math.random() * 2.2, v: 0.3 + Math.random() * 0.6 });
        g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1;
        for (const b of bubbles) { g.beginPath(); g.arc(b.x + Math.sin(b.y * 0.08) * 1.5, b.y, b.r, 0, Math.PI * 2); g.stroke(); }
      } else {
        g.fillStyle = "rgba(237,231,219,.4)"; g.font = `500 ${Math.max(13, G.bw * 0.065)}px "IBM Plex Sans", sans-serif`; g.textAlign = "center";
        g.fillText("Tap a vial to add a drop", G.cx, G.yB - G.bh * 0.45);
      }
      g.restore();

      g.lineWidth = 2.2; g.strokeStyle = "rgba(255,255,255,.42)"; g.stroke(glass);
      g.lineWidth = 1; g.strokeStyle = "rgba(255,255,255,.12)"; g.stroke(interiorPath(G, 4));
      g.beginPath(); g.ellipse(G.cx, G.yT, G.bw / 2, 5, 0, 0, Math.PI * 2); g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.6; g.stroke();
      g.beginPath(); g.moveTo(G.x0 - 2, G.yT); g.quadraticCurveTo(G.x0 - 12, G.yT - 4, G.x0 - 14, G.yT - 10); g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 2; g.stroke();
      const hl = g.createLinearGradient(G.x0, 0, G.x0 + G.bw * 0.2, 0); hl.addColorStop(0, "rgba(255,255,255,.28)"); hl.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = hl; g.fillRect(G.x0 + 6, G.yT + 10, G.bw * 0.09, G.bh * 0.78);
      g.fillStyle = "rgba(255,255,255,.18)"; g.fillRect(G.x1 - 14, G.yT + 20, 3, G.bh * 0.6);
      g.font = `400 ${Math.max(10, G.bw * 0.045)}px "IBM Plex Mono", monospace`; g.textAlign = "left"; g.fillStyle = "rgba(255,255,255,.55)"; g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1;
      for (let d = 5; d <= CAP; d += 5) {
        const y = G.yB - innerH * (d / CAP), major = d % 10 === 0;

        if (major) g.fillText(String(d), G.x1 + 8, y + 4);
      }
      g.fillText("drops", G.x1 + 8, G.yT + 4);

      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i]; d.vy += 0.55; d.y += d.vy;
        const hit = Math.max(yL, G.yT + 6);
        if (d.y >= hit) {

    const ts = TIER_SPEC[s.line];
    ln.push("", "SCENT", `  Name       ${s.scent.name || "Untitled"}`);
    ln.push(`  Oil grade  ${ts.grade}: ${ts.oil}`);
    ln.push(`  Lasts      ${ts.lasts.replace(" (target)", "")} (target; confirm in testing)`);
    if (s.scent.story) ln.push(`  Story      ${s.scent.story}`);
    for (const [id, label] of TIERS) ln.push(`  ${label.padEnd(10)} ${tr[id].map(([n, v]) => `${n} ${Math.round((v / t) * 100)}%`).join(", ") || "-"}`);
    const p = tierPct(f);
    ln.push(`  Balance    top ${p.top}% / heart ${p.heart}% / base ${p.base}% (by drops)`);
    ln.push(`  Strength   ${s.scent.strength}/5 (${STRENGTH_WORDS[s.scent.strength]})`);
    if (s.scent.brief) ln.push("", "PERFUMER BRIEF", "  " + s.scent.brief);
    ln.push("", "SUPPLIER MUST PROVIDE",
      "  - IFRA certificate covering Category 12 (solid car diffuser)", "  - SDS (safety data sheet)",
      "  - Flash point of finished oil above 200°F", "  - Phthalate-free statement",
      "  - Fragrance allergen list (California Right to Know Act)", "  - Prop 65 statement",
      "", "TARGETS (estimates)", `  Retail     $${priceOf(s)} (${L.priceNote})`, `  Landed     ${money(cr[0])}–${money(cr[1])} per unit`);
    return ln.join("\n");
  }
  function renderSpecPanel() {
    const s = state, cr = costRange(s), price = priceOf(s);
    $("workshop").innerHTML = `<div class="group"><div class="economics">
        <div><span>Retail</span><b>$${price}</b><small>${esc(LINES[s.line].priceNote)}${s.line === "reserve" && price !== 295 ? " · with upgrades (suggested)" : ""}</small></div>
        <div><span>Landed cost</span><b>${money(cr[0])}–${money(cr[1])}</b><small>rough estimate</small></div>
        <div><span>Gross / unit</span><b>${money(price - cr[1])}+</b><small>before shipping & fees</small></div></div>
      <pre class="spec" id="specText"></pre>
      <div class="btnrow"><button class="btn ghost" id="copyBtn" type="button">Copy spec</button><span class="status" id="copyStatus"></span></div></div>`;
    $("specText").textContent = specText(s);
  }

  function renderTiers() {
    $("tiers").innerHTML = Object.entries(TIER_SPEC).map(([id, t]) => `<button type="button" class="tiercard" data-line="${id}" aria-pressed="${state.line === id}">
      <div class="tg">${t.tag}</div>
      <div class="th"><b>${id === "daily" ? "SMP Daily" : LINES[id].label}</b><span>$${LINES[id].price}</span></div>
      <dl><dt>Made of</dt><dd>${esc(t.material)}</dd>
      <dt>Scent</dt><dd>${esc(t.grade)}<span class="gems" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= t.meter ? "on" : ""}"></i>`).join("")}</span> · ${esc(t.oil)}</dd>
      <dt>Lasts</dt><dd>${esc(t.lasts)} · ${esc(t.throw.toLowerCase())}</dd></dl></button>`).join("");
  }
  function renderLineSeg() {
    $("lineSeg").innerHTML = Object.entries(LINES).map(([id, L]) => `<button type="button" data-line="${id}" aria-pressed="${state.line === id}">${L.label}<small>$${L.price}</small></button>`).join("");
  }
  function renderPanel() { if (mode === "object") renderObjectPanel(); else if (mode === "scent") renderScentPanel(); else renderSpecPanel(); }
  function renderAll() {
    document.body.className = "mode-" + mode;
    for (const b of document.querySelectorAll("nav.modes button")) b.setAttribute("aria-selected", String(b.dataset.mode === mode));
    renderLineSeg(); renderTiers(); renderStage(); renderSummary(); renderFormula(); renderPanel(); renderSaveButtons(); markCurrentCard(); saveDraft();
  }
  function renderLive() { renderStage(); renderSummary(); renderFormula(); saveDraft(); }
  function renderAfterDrop() {
    renderStage(); renderSummary(); renderFormula();
    if (mode === "scent") {
      const y = window.scrollY;
      const nm = $("sname") ? $("sname").value : null, st = $("sstory") ? $("sstory").value : null;
      renderScentPanel();
      if (nm !== null && $("sname")) { $("sname").value = nm; $("sstory").value = st; }
      window.scrollTo(0, y);
    }
    saveDraft();
  }

  // ================= Events =================
  function pushHistory() { history.push(clone(state.scent.formula)); if (history.length > 60) history.shift(); }
  function addDrop(n) {
    const f = state.scent.formula;
    if (pouring || !ING[n] || total(f) >= CAP || (f[n] || 0) >= MAX_PER_NOTE) return;
    pushHistory();
    f[n] = (f[n] || 0) + 1; state.scent.preset = "custom";
    Beaker.drop(colOf(n));
    renderAfterDrop();
  }
  function pour(recipeId) {
    const r = RECIPES.find((x) => x.id === recipeId); if (!r || pouring) return;
    pushHistory();
    state.scent.formula = {}; state.scent.preset = r.id; state.scent.name = r.name; state.scent.story = r.story; state.scent.brief = "";
    if (REDUCED) { state.scent.formula = clone(r.f); Beaker.settle(); return renderAll(); }
    Beaker.settle();
    pouring = true; renderAll();
    const seq = []; for (const [n, v] of Object.entries(r.f)) for (let i = 0; i < v; i++) seq.push(n);
    for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = seq[i]; seq[i] = seq[j]; seq[j] = tmp; }
    let i = 0;
    const step = () => {
      if (i >= seq.length) { pouring = false; renderAll(); return; }
      const n = seq[i++]; state.scent.formula[n] = (state.scent.formula[n] || 0) + 1;
      Beaker.drop(colOf(n));
      renderStage(); renderFormula(); saveDraft();
      setTimeout(step, 85);
    };
    step();
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t || t.disabled) return;
    if (t.dataset.line) {
      if (t.dataset.line === state.line) return;
      state.line = t.dataset.line;
      state.scent.strength = LINES[state.line].strength;
      return renderAll();
    }
    if (t.dataset.mode) { mode = t.dataset.mode; if (mode === "scent") Beaker.settle(); return renderAll(); }
    if (t.dataset.set) { const parts = t.dataset.set.split("."), v = t.dataset.set === "res.size" ? +t.dataset.val : t.dataset.val; if (parts[1]) state[parts[0]][parts[1]] = v; else state[parts[0]] = v; return renderAll(); }
    if (t.dataset.vial) return addDrop(t.dataset.vial);
    if (t.dataset.inc) return addDrop(t.dataset.inc);
    if (t.dataset.dec) {
      const n = t.dataset.dec, f = state.scent.formula; if (!f[n] || pouring) return;
      pushHistory(); f[n] -= 1; if (!f[n]) delete f[n]; state.scent.preset = "custom"; return renderAfterDrop();
    }
    if (t.dataset.pour) return pour(t.dataset.pour);
    if (t.id === "undoBtn" && history.length && !pouring) { state.scent.formula = history.pop(); state.scent.preset = "custom"; return renderAfterDrop(); }
    if (t.id === "emptyBtn" && !pouring) { pushHistory(); state.scent.formula = {}; state.scent.preset = "custom"; return renderAfterDrop(); }
    if (t.id === "copyBtn") {
      const text = $("specText").textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($("specText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copyStatus").textContent = "Selected. Press Ctrl+C or ⌘C to copy."; };
      try { navigator.clipboard.writeText(text).then(() => { $("copyStatus").textContent = "Copied."; }, fallback); } catch (_) { fallback(); }
      return;
    }
    if (t.id === "nameBtn") return nameIt();
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "sigInitial") { state.sig.initial = t.value.replace(/[^A-Za-z]/g, "").slice(0, 1).toUpperCase(); return renderLive(); }
    if (t.id === "resMono") { state.res.monogram = t.value.replace(/[^A-Za-z&]/g, "").slice(0, 3); return renderLive(); }
    if (t.id === "resEdition") { state.res.edition = t.value.replace(/[^0-9]/g, "").slice(0, 3); return renderLive(); }
    if (t.id === "sname") { state.scent.name = t.value; return renderLive(); }
    if (t.id === "sstory") { state.scent.story = t.value; return renderLive(); }
    if (t.id === "strength") { state.scent.strength = +t.value; $("strVal").textContent = `${state.scent.strength} · ${STRENGTH_WORDS[state.scent.strength]}`; return renderLive(); }
  });

  // ================= Claude naming =================
  let sampleApi = null;
  async function nameIt() {
    if (!sampleApi) return;
    const btn = $("nameBtn"), st = $("nameStatus"); btn.disabled = true; st.textContent = "Naming…";
    const s = state, f = s.scent.formula, t = total(f) || 1;
    const formula = Object.entries(f).map(([n, v]) => `${n} ${Math.round((v / t) * 100)}% (${tierOf(n)})`).join(", ");
    const prompt = `You name scents for Sutherland Motor Parfum, a luxury car fragrance brand with three lines: Daily (cheap hanging card), Signature (metal vent clip), Reserve (solid brass, for exotic-car owners).
Line: ${LINES[s.line].label}. Strength ${s.scent.strength}/5.
Formula by drops: ${formula || "empty"}.
Return JSON only: {"name": "2-3 words, evocative of driving, roads, cars or luxury travel; never a designer, perfume house or carmaker name", "story": "one line under 12 words, plain and confident", "brief": "two sentences a perfumer could work from, covering the mood and how it should open and dry down"}.`;
    try {
      const out = await sampleApi.json(prompt, { modelTier: "quick" });
      if (out && out.name) {
        state.scent.name = String(out.name).slice(0, 28); state.scent.story = String(out.story || "").slice(0, 70); state.scent.brief = String(out.brief || "").slice(0, 400);
        renderAll(); const s2 = $("nameStatus"); if (s2) s2.textContent = "Named. The perfumer brief is on the spec sheet.";
      } else st.textContent = "No name came back. Try again.";
    } catch (err) {
      if (err && err.code === "not_granted") { sampleApi = null; const r = $("nameRow"); if (r) r.hidden = true; }
      else { const s2 = $("nameStatus"); if (s2) s2.textContent = err && err.code === "rate_limited" ? "Too many requests. Wait a minute and try again." : "Naming didn't work this time. Try again."; }
    } finally { const b = $("nameBtn"); if (b) b.disabled = false; }
  }

  // ================= Saved designs =================
  let db = null, uid = null, canWrite = true, saved = [];
  function renderSaveButtons() { $("saveBtn").hidden = !db || !canWrite; $("updateBtn").hidden = !db || !canWrite || !loadedId; }
  function markCurrentCard() { for (const c of document.querySelectorAll(".gcard")) c.classList.toggle("current", c.dataset.id === loadedId); }
  function renderGallery(note) {
    const g = $("gallery");
    if (!db) { g.innerHTML = `<div class="emptystate">${note || "Saving needs this page open on claude.ai while signed in. Your current design is kept in this browser either way."}</div>`; return; }
    if (!saved.length) { g.innerHTML = `<div class="emptystate">${note || "Nothing saved yet. Design the object, mix its scent, then press Save design."}</div>`; return; }
    g.innerHTML = saved.map((d) => {
      const s = normalize(d.design);
      let thumb = ""; try { thumb = renderSVG(s, "t" + d.id.replace(/[^a-zA-Z0-9]/g, "")); } catch (_) {}
      const when = d.savedAt ? new Date(d.savedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
      return `<div class="gcard${d.id === loadedId ? " current" : ""}" data-id="${esc(d.id)}"><div class="thumb">${thumb}</div>
        <div class="meta"><b>${esc(s.scent.name || "Untitled")}</b><span>${esc(LINES[s.line].label)}${d.tag ? " · " + esc(d.tag) : ""}${when ? " · " + esc(when) : ""}</span></div>
        <div class="acts"><button type="button" class="btn ghost small" data-load="${esc(d.id)}">Open</button>${canWrite ? `<button type="button" class="btn ghost small" data-del="${esc(d.id)}">Delete</button>` : ""}</div></div>`;
    }).join("");
  }
  document.addEventListener("click", async (e) => {
    const L = e.target.closest("[data-load]");
    if (L) {
      const d = saved.find((x) => x.id === L.dataset.load); if (!d) return;
      state = normalize(d.design); loadedId = d.id; history = []; Beaker.settle();
      $("saveStatus").textContent = `Opened "${state.scent.name}".`;
      renderAll(); window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); return;
    }
    const D = e.target.closest("[data-del]");
    if (D && db) {
      if (D.dataset.armed !== "1") { D.dataset.armed = "1"; D.textContent = "Confirm"; setTimeout(() => { if (D.isConnected) { D.dataset.armed = ""; D.textContent = "Delete"; } }, 3500); return; }
      D.disabled = true;
      try { await db.collection("designs").doc(D.dataset.del).delete(); if (loadedId === D.dataset.del) loadedId = null; $("saveStatus").textContent = "Deleted."; renderSaveButtons(); }
      catch (_) { $("saveStatus").textContent = "Couldn't delete it. Try again."; D.disabled = false; }
    }
  });
  async function writeDesign(ref, verb) {
    const btns = [$("saveBtn"), $("updateBtn")]; btns.forEach((b) => (b.disabled = true));
    $("saveStatus").textContent = verb === "update" ? "Updating…" : "Saving…";
    try {
      const tr = tiersOf(state.scent.formula);
      await ref.set({ design: clone(state), title: `${state.scent.name || "Untitled"} · ${LINES[state.line].label}`, line: state.line,
        notes: { top: tr.top.map((x) => x[0]), heart: tr.heart.map((x) => x[0]), base: tr.base.map((x) => x[0]) },
        savedAt: new Date().toISOString(), by: uid || null });
      loadedId = ref.id; $("saveStatus").textContent = verb === "update" ? "Updated." : "Saved."; renderSaveButtons();
    } catch (err) {
      if (err && err.code === "invalid_argument") { canWrite = false; renderSaveButtons(); $("saveStatus").textContent = "You can view designs here but not save them."; }
      else if (err && err.code === "quota_exceeded") $("saveStatus").textContent = "Storage is full. Delete a few old designs first.";
      else $("saveStatus").textContent = "Couldn't save. Check your connection and try again.";
    } finally { btns.forEach((b) => (b.disabled = false)); }
  }
  $("saveBtn").addEventListener("click", () => db && writeDesign(db.collection("designs").doc(), "save"));
  $("updateBtn").addEventListener("click", () => db && loadedId && writeDesign(db.collection("designs").doc(loadedId), "update"));

  // ================= Boot =================
  Beaker.settle();
  renderAll();
  renderGallery();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { built3DKey = ""; if (mode !== "scent") renderStage(); });

  const use = (n) => (window.claude && typeof window.claude.use === "function" ? window.claude.use(n) : Promise.resolve(null));
  use("sample").then((s) => { sampleApi = s; const r = $("nameRow"); if (r && s) r.hidden = false; }).catch(() => {});
  Promise.all([use("db"), use("user")]).then(async ([d, u]) => {
    db = d;
    if (u) {
      try { uid = await u.id(); } catch (_) {}
      try { if ((await u.can("data.write")) === false) canWrite = false; } catch (_) {}
    }
    if (!db) { renderGallery(); renderSaveButtons(); return; }
    renderSaveButtons(); renderGallery("Loading saved designs…");
    let settled = false;
    const timer = setTimeout(() => { if (!settled) renderGallery("Saved designs can't be reached yet. They'll appear when the connection comes back."); }, 10000);
    db.collection("designs").orderBy("savedAt", "desc").limit(60).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); }
      saved = snap.docs.map((x) => Object.assign({ id: x.id }, x.data()));
      if (loadedId && !saved.some((x) => x.id === loadedId)) { loadedId = null; renderSaveButtons(); }
      renderGallery();
    }, () => { settled = true; clearTimeout(timer); renderGallery("Saved designs aren't available right now."); });
  }).catch(() => renderGallery());
})();
</script>
