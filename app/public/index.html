<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Patrick Flip Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Patrick</h1>
    <nav>
      <button id="tab-scan" class="tab active" type="button">Scan</button>
      <button id="tab-find" class="tab" type="button">Find</button>
      <button id="tab-log" class="tab" type="button">Log</button>
    </nav>
  </header>

  <main id="view-scan">
    <section class="card" id="lock" hidden>
      <label for="passcode">Passcode</label>
      <input id="passcode" type="password" autocomplete="current-password">
      <p class="hint">Saved on this phone only.</p>
    </section>

    <section class="card">
      <div class="modes" id="modes" role="tablist" aria-label="What are you scanning">
        <button type="button" class="mode" data-mode="item">Thrift item</button>
        <button type="button" class="mode" data-mode="furniture">Furniture</button>
        <button type="button" class="mode" data-mode="listing">Listing</button>
      </div>
      <p class="hint" id="mode-hint"></p>
      <div class="row">
        <div class="field">
          <label for="tag" id="tag-label">Tag price ($)</label>
          <input id="tag" type="number" inputmode="decimal" min="0" step="0.01" placeholder="optional">
        </div>
        <div class="field grow">
          <label for="note">Note</label>
          <input id="note" type="text" maxlength="300" placeholder="e.g. works, no box">
        </div>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <button id="scan" class="scan" type="button">Scan item</button>
      <p class="hint" id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" hidden></section>
  </main>

  <main id="view-find" hidden>
    <section class="card">
      <div class="row">
        <div class="field">
          <label for="maxprice">Max price ($)</label>
          <input id="maxprice" type="number" inputmode="numeric" min="0" step="5">
        </div>
        <div class="field grow">
          <label for="clcity">Craigslist city</label>
          <input id="clcity" type="text" autocapitalize="none" autocomplete="off" placeholder="e.g. denver">
        </div>
      </div>
      <p class="hint">City is the part before .craigslist.org. Facebook and OfferUp use your account location.</p>
      <label for="custom">Search for anything</label>
      <input id="custom" type="text" placeholder="e.g. solid oak desk">
      <div class="links" id="custom-links" style="margin-top:8px"></div>
    </section>
    <div id="presets"></div>
    <section class="card" id="tips"></section>
  </main>

  <main id="view-log" hidden>
    <section class="card summary" id="summary"></section>
    <section id="log"></section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
