<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Patrick Flip Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Patrick</h1>
    <nav>
      <button id="tab-scan" class="tab active" type="button">Scan</button>
      <button id="tab-log" class="tab" type="button">Log</button>
      <button id="tab-studio" class="tab" type="button">Studio</button>
    </nav>
  </header>

  <main id="view-scan">
    <section class="card" id="lock" hidden>
      <label for="passcode">Passcode</label>
      <input id="passcode" type="password" autocomplete="current-password">
      <p class="hint">Saved on this phone only.</p>
    </section>

    <section class="card">
      <div class="row">
        <div class="field">
          <label for="tag">Tag price ($)</label>
          <input id="tag" type="number" inputmode="decimal" min="0" step="0.01" placeholder="optional">
        </div>
        <div class="field grow">
          <label for="note">Note</label>
          <input id="note" type="text" maxlength="300" placeholder="e.g. works, no box">
        </div>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <button id="scan" class="scan" type="button">Scan item</button>
      <p class="hint" id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" hidden></section>
  </main>

  <main id="view-log" hidden>
    <section class="card summary" id="summary"></section>
    <section id="log"></section>
  </main>

  <main id="view-studio" hidden>
    <section class="card">
      <h2>Clip a long video</h2>
      <label for="clip-url">Video link</label>
      <input id="clip-url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=...">
      <div class="actions" style="margin-top:10px">
        <button id="clip-go" class="btn primary" type="button">Clip it</button>
        <button id="clip-file-btn" class="btn" type="button">Upload video</button>
      </div>
      <input id="clip-file" type="file" accept="video/*" hidden>
      <p class="hint">Only use videos you own or have the rights to.</p>
    </section>

    <section class="card">
      <h2>Make a short from an idea</h2>
      <label for="short-topic">Topic</label>
      <input id="short-topic" type="text" maxlength="500" placeholder="e.g. 3 thrift finds that sell fast on eBay">
      <button id="short-go" class="btn primary" type="button" style="width:100%;margin-top:10px">Write it and render it</button>
    </section>

    <p class="hint" id="studio-status" role="status" aria-live="polite"></p>
    <section class="card" id="studio-services" hidden></section>
    <section id="studio-jobs"></section>
    <section id="studio-queue"></section>
  </main>

  <script src="app.js" type="module"></script>
  <script src="studio.js" type="module"></script>
</body>
</html>
