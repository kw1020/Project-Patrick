<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Patrick{% endblock %}</title>
<style>
  :root { --bg:#0b0d12; --card:#151922; --line:#262c3a; --text:#e8ebf2; --muted:#8f98ad; --accent:#4cc9f0; --bad:#ff6b6b; --good:#5ee09a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:8px 0 2px; letter-spacing:.5px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input, select, button { width:100%; font:inherit; color:var(--text); background:#0f131b; border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  input[type=range] { padding:0; accent-color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { background:var(--accent); color:#04222c; font-weight:700; border:0; cursor:pointer; margin-top:6px; }
  button:disabled { opacity:.5; cursor:default; }
  .link { background:none; color:var(--muted); font-weight:400; width:auto; padding:0; border:0; text-decoration:underline; }
  .err { color:var(--bad); } .ok { color:var(--good); }
  video { width:100%; border-radius:12px; background:#000; max-height:70vh; }
  details { margin-top:14px; } summary { cursor:pointer; color:var(--accent); }
  .hint { font-size:13px; color:var(--muted); margin-top:4px; }
  .bar { height:8px; background:#0f131b; border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
