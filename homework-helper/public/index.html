<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrick Homework Helper</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1b1d24; --muted:#6b7080; --accent:#3b5bfd; --me:#e8edff; --border:#dfe2ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1b1e26; --text:#e9ebf1; --muted:#9aa0b0; --accent:#7b93ff; --me:#26304d; --border:#2c303b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  h1 { font-size:1.4rem; margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  #chat { flex:1; display:flex; flex-direction:column; gap:12px; padding-bottom:16px; }
  .msg { padding:12px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; border:1px solid var(--border); background:var(--card); }
  .msg.me { background:var(--me); align-self:flex-end; max-width:85%; }
  .msg img { max-width:100%; border-radius:8px; display:block; margin-bottom:6px; }
  form { position:sticky; bottom:0; background:var(--bg); padding:8px 0 16px; display:flex; flex-direction:column; gap:8px; }
  textarea, input[type=password] { width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font:inherit; }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, label.btn { padding:10px 16px; border-radius:12px; border:0; font:inherit; cursor:pointer; }
  button[type=submit] { background:var(--accent); color:#fff; margin-left:auto; }
  button:disabled { opacity:.5; cursor:default; }
  label.btn { background:var(--card); border:1px solid var(--border); }
  #preview { color:var(--muted); font-size:.9rem; }
  #newChat { background:transparent; color:var(--muted); padding:10px 4px; }
</style>
</head>
<body>
<main>
  <h1>📚 Patrick Homework Helper</h1>
  <p class="sub">Snap a photo of your homework or type a question. Patrick walks you through it step by step.</p>

  <div id="codeBox" hidden>
    <input id="code" type="password" placeholder="Access code">
  </div>

  <div id="chat"></div>

  <form id="form">
    <textarea id="text" placeholder="Type your question (or just add a photo)…"></textarea>
    <div class="row">
      <label class="btn">📷 Photo<input id="photo" type="file" accept="image/*" hidden></label>
      <span id="preview"></span>
      <button type="button" id="newChat">New question</button>
      <button type="submit" id="send">Ask Patrick</button>
    </div>
  </form>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const text = document.getElementById("text");
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const send = document.getElementById("send");
const codeInput = document.getElementById("code");
const codeBox = document.getElementById("codeBox");

let history = [];
let pendingImage = null; // { media_type, data, url }

function store(key, val) { try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
codeInput.value = load("patrick-code") || "";
codeBox.hidden = !!codeInput.value;

// Shrink photos so uploads are fast and cheap.
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1600;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.85);
      resolve({ media_type: "image/jpeg", data: url.split(",")[1], url });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

photo.addEventListener("change", async () => {
  const file = photo.files[0];
  if (!file) return;
  pendingImage = await shrink(file);
  preview.textContent = "Photo added ✓";
});

document.getElementById("newChat").addEventListener("click", () => {
  history = [];
  chat.innerHTML = "";
  pendingImage = null;
  preview.textContent = "";
});

function bubble(cls, content, imgUrl) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (imgUrl) { const im = document.createElement("img"); im.src = imgUrl; div.appendChild(im); }
  const span = document.createElement("span");
  span.textContent = content;
  div.appendChild(span);
  chat.appendChild(div);
  div.scrollIntoView({ block: "end" });
  return span;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = text.value.trim();
  if (!q && !pendingImage) return;

  const content = [];
  if (pendingImage) content.push({ type: "image", source: { type: "base64", media_type: pendingImage.media_type, data: pendingImage.data } });
  content.push({ type: "text", text: q || "Help me with this homework." });

  bubble("me", q, pendingImage && pendingImage.url);
  history.push({ role: "user", content });
  text.value = ""; pendingImage = null; photo.value = ""; preview.textContent = "";
  send.disabled = true;

  const out = bubble("bot", "Patrick is thinking…");
  let answer = "";
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: codeInput.value, messages: history }),
    });
    if (res.status === 401) {
      codeBox.hidden = false; store("patrick-code", null);
      out.textContent = "Enter your access code above, then ask again.";
      history.pop();
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      out.textContent = err.error || "Something went wrong. Try again.";
      history.pop();
      return;
    }
    store("patrick-code", codeInput.value);
    codeBox.hidden = !!codeInput.value;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += dec.decode(value, { stream: true });
      out.textContent = answer;
      out.parentElement.scrollIntoView({ block: "end" });
    }
    history.push({ role: "assistant", content: answer || "(no answer)" });
  } catch {
    out.textContent = "Couldn't reach Patrick. Check your internet and try again.";
    history.pop();
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
